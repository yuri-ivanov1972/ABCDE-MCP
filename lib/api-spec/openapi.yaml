openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /stats:
    get:
      operationId: getPublicStats
      tags: [stats]
      summary: Get aggregate MCP usage counters
      description: Returns aggregate tool-call and measured-session counters without individual session identifiers or request contents.
      responses:
        "200":
          description: Aggregate counters are available
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PublicStats"
        "503":
          description: Aggregate counters are temporarily unavailable
components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    PublicStats:
      type: object
      properties:
        toolCalls:
          type: integer
          minimum: 0
        measuredSessions:
          type: [integer, "null"]
          minimum: 0
        sessionMeasurementAvailable:
          type: boolean
      required:
        - toolCalls
        - measuredSessions
        - sessionMeasurementAvailable

